name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install the Teensy core
        run: |
          arduino-cli core update-index \
            --additional-urls https://www.pjrc.com/teensy/package_teensy_index.json
          arduino-cli core install teensy:avr \
            --additional-urls https://www.pjrc.com/teensy/package_teensy_index.json

      # Builds all four input/lamp combinations, so neither the resistor-ladder
      # path nor the GPIO path can rot while the other is in use.
      - name: Compile every hardware configuration
        run: make matrix

  # Plays every game mode and the lamp dance on the runner, under
  # AddressSanitizer and UBSan. clang, because that is what it is developed
  # against on macOS; the runner image ships it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the host tests
        run: make test CXX=clang++

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check C++ formatting
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          make format-check

  display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the wiring doc's pin table against Config.h
        run: make check-pins

      - uses: astral-sh/ruff-action@v3
        with:
          args: check .

      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check .
