<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="700" fill="#FFFFFF"/>
<defs><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8342B"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#23598F"/></marker></defs>
<text x="30" y="40" font-size="22" font-weight="700" fill="#14191E">Cub Scout Button Mash — system overview</text>
<text x="30" y="62" font-size="13" fill="#414C56">One supply, one star point, four loads. Power never daisy-chains through the buttons; only the pixel data does.</text>
<rect x="30" y="95" width="200" height="70" rx="8" fill="#F4F6F8" stroke="#B8342B" stroke-width="2"/>
<text x="44" y="121" font-size="16" font-weight="700" fill="#14191E">USB-C power bank</text>
<text x="44" y="143" font-size="12.5" fill="#414C56">PD source</text>
<rect x="30" y="215" width="200" height="70" rx="8" fill="#F4F6F8" stroke="#B8342B" stroke-width="2"/>
<text x="44" y="241" font-size="16" font-weight="700" fill="#14191E">HUSB238 PD trigger</text>
<text x="44" y="263" font-size="12.5" fill="#414C56">5 V · 3 A contract (15 W)</text>
<rect x="30" y="335" width="200" height="110" rx="8" fill="#F4F6F8" stroke="#B8342B" stroke-width="2"/>
<text x="44" y="361" font-size="16" font-weight="700" fill="#14191E">Star point</text>
<text x="44" y="383" font-size="12.5" fill="#414C56">WAGO 221-415 lever nuts</text>
<text x="44" y="401" font-size="12.5" fill="#414C56">+5 V and GND fan out here</text>
<text x="44" y="419" font-size="12.5" fill="#414C56">worst case ≈ 2.46 A total</text>
<path d="M130,165 L130,213" fill="none" stroke="#B8342B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ap)"/>
<text x="142" y="194" font-size="12" font-weight="600" fill="#B8342B" text-anchor="start">USB-C</text>
<path d="M130,285 L130,333" fill="none" stroke="#B8342B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ap)"/>
<text x="142" y="314" font-size="12" font-weight="600" fill="#B8342B" text-anchor="start">5 V</text>
<rect x="340" y="120" width="250" height="100" rx="8" fill="#F4F6F8" stroke="#14191E" stroke-width="2"/>
<text x="354" y="146" font-size="16" font-weight="700" fill="#14191E">Matrix Portal S3</text>
<text x="354" y="168" font-size="12.5" fill="#414C56">CircuitPython · renders only</text>
<text x="354" y="186" font-size="12.5" fill="#414C56">≈ 0.15 A</text>
<rect x="700" y="120" width="260" height="100" rx="8" fill="#F4F6F8" stroke="#14191E" stroke-width="2"/>
<text x="714" y="146" font-size="16" font-weight="700" fill="#14191E">32×32 HUB75 LED panel</text>
<text x="714" y="168" font-size="12.5" fill="#414C56">≈ 0.40 A typical</text>
<text x="714" y="186" font-size="12.5" fill="#414C56">(text on black)</text>
<rect x="340" y="360" width="250" height="120" rx="8" fill="#F4F6F8" stroke="#14191E" stroke-width="2"/>
<text x="354" y="386" font-size="16" font-weight="700" fill="#14191E">Controller stripboard</text>
<text x="354" y="408" font-size="12.5" fill="#414C56">Teensy 4.1 — runs the game</text>
<text x="354" y="426" font-size="12.5" fill="#414C56">74AHCT125 level shifter</text>
<text x="354" y="444" font-size="12.5" fill="#414C56">  for the pixel data line</text>
<text x="354" y="462" font-size="12.5" fill="#414C56">≈ 0.10 A</text>
<rect x="700" y="360" width="260" height="120" rx="8" fill="#F4F6F8" stroke="#14191E" stroke-width="2"/>
<text x="714" y="386" font-size="16" font-weight="700" fill="#14191E">Button board PCB</text>
<text x="714" y="408" font-size="12.5" fill="#414C56">J1–J10  cap pigtails</text>
<text x="714" y="426" font-size="12.5" fill="#414C56">J11–J12  start buttons</text>
<text x="714" y="444" font-size="12.5" fill="#414C56">J13  harness · J14  5 V in</text>
<text x="714" y="462" font-size="12.5" fill="#414C56">rings ≤ 1.81 A (LED ALL)</text>
<rect x="560" y="575" width="190" height="95" rx="8" fill="#F4F6F8" stroke="#14191E" stroke-width="2"/>
<text x="574" y="601" font-size="16" font-weight="700" fill="#14191E">10 dome caps</text>
<text x="574" y="623" font-size="12.5" fill="#414C56">12-pixel WS2812 ring</text>
<text x="574" y="641" font-size="12.5" fill="#414C56">+ switch, 330 Ω on DIN</text>
<text x="574" y="659" font-size="12.5" fill="#414C56">6-pin JST-XH each</text>
<rect x="770" y="575" width="190" height="95" rx="8" fill="#F4F6F8" stroke="#14191E" stroke-width="2"/>
<text x="784" y="601" font-size="16" font-weight="700" fill="#14191E">2 start buttons</text>
<text x="784" y="623" font-size="12.5" fill="#414C56">Switch only, no lamp</text>
<text x="784" y="641" font-size="12.5" fill="#414C56">2-pin JST-XH each</text>
<path d="M230,362 L300,362 L300,180 L338,180" fill="none" stroke="#B8342B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ap)"/>
<text x="308" y="254" font-size="12" font-weight="600" fill="#B8342B" text-anchor="start">USB-C pigtail</text>
<path d="M230,350 L270,350 L270,90 L830,90 L830,118" fill="none" stroke="#B8342B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ap)"/>
<text x="560" y="84" font-size="12" font-weight="600" fill="#B8342B" text-anchor="middle">Panel power lead, straight from the star</text>
<text x="560" y="108" font-size="11" font-weight="600" fill="#B8342B" text-anchor="middle">never through the Portal&#x27;s screw terminals</text>
<path d="M230,420 L338,420" fill="none" stroke="#B8342B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ap)"/>
<text x="240" y="412" font-size="12" font-weight="600" fill="#B8342B" text-anchor="start">22 AWG</text>
<path d="M230,435 L250,435 L250,530 L720,530 L720,482" fill="none" stroke="#B8342B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ap)"/>
<text x="260" y="548" font-size="12" font-weight="600" fill="#B8342B" text-anchor="start">18 AWG to J14 screw terminal</text>
<path d="M592,170 L698,170" fill="none" stroke="#23598F" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#as)"/>
<text x="645" y="160" font-size="12" font-weight="600" fill="#23598F" text-anchor="middle">HUB75</text>
<text x="645" y="190" font-size="11" font-weight="600" fill="#23598F" text-anchor="middle">plugs onto panel</text>
<path d="M465,358 L465,222" fill="none" stroke="#23598F" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#as)" marker-end="url(#as)"/>
<text x="477" y="265" font-size="12" font-weight="600" fill="#23598F" text-anchor="start">Serial1, 115200 baud</text>
<text x="477" y="281" font-size="11" font-weight="600" fill="#23598F" text-anchor="start">3-pin JST-XH: TX→RX, RX←TX, GND</text>
<text x="477" y="296" font-size="11" font-weight="600" fill="#23598F" text-anchor="start">Teensy pins 1 (TX), 0 (RX)</text>
<path d="M592,420 L698,420" fill="none" stroke="#23598F" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#as)" marker-end="url(#as)"/>
<text x="645" y="398" font-size="12" font-weight="600" fill="#23598F" text-anchor="middle">J13 · 14-way</text>
<text x="645" y="444" font-size="11" font-weight="600" fill="#23598F" text-anchor="middle">12 switches, GND,</text>
<text x="645" y="458" font-size="11" font-weight="600" fill="#23598F" text-anchor="middle">pixel data (pin 8)</text>
<path d="M800,482 L800,552 L655,552 L655,573" fill="none" stroke="#23598F" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#as)"/>
<path d="M865,482 L865,573" fill="none" stroke="#23598F" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#as)"/>
<text x="645" y="568" font-size="11" font-weight="600" fill="#23598F" text-anchor="end">+5 V, GND, data in/out, switch</text>
<line x1="30" y1="600" x2="70" y2="600" stroke="#B8342B" stroke-width="2.5"/>
<text x="80" y="604" font-size="12" font-weight="600" fill="#B8342B" text-anchor="start">+5 V / GND pair</text>
<line x1="30" y1="628" x2="70" y2="628" stroke="#23598F" stroke-width="2.5"/>
<text x="80" y="632" font-size="12" font-weight="600" fill="#23598F" text-anchor="start">Signals</text>
<text x="30" y="662" font-size="11" font-weight="600" fill="#414C56" text-anchor="start">Currents are the wiring reference&#x27;s budget.</text>
<text x="30" y="677" font-size="11" font-weight="400" fill="#414C56" text-anchor="start">Pins from firmware/WhackAMole/Config.h.</text>
</svg>
